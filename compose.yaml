services:
  office:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      OFFICE_API_TOKEN: ${OFFICE_API_TOKEN:?Set OFFICE_API_TOKEN in .env}
      OFFICE_MIRROR_URL: ${OFFICE_MIRROR_URL:-}
      OFFICE_MIRROR_TOKEN: ${OFFICE_MIRROR_TOKEN:-}
      OFFICE_MAX_VIEWERS: ${OFFICE_MAX_VIEWERS:-3}
      HOST: 0.0.0.0
      PORT: 3000
